{% extends 'layouts/main.html' %}
{% block title %}服务器错误{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-16 sm:py-24 text-center">
  {# Visual icon #}
  <div class="w-24 h-24 rounded-full bg-red-100 flex items-center justify-center mb-8">
    <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
  </div>

  {# Big error code #}
  <div class="text-7xl sm:text-8xl font-extrabold text-gray-200 mb-3 select-none">500</div>

  {# Descriptive message #}
  <h2 class="text-xl sm:text-2xl font-semibold text-gray-700 mb-2">服务器开小差了</h2>
  <p class="text-gray-500 mb-8 max-w-sm px-4 text-sm sm:text-base">
    抱歉，服务器遇到了一些问题。请稍后再试，或返回首页。
  </p>

  {# Action buttons #}
  <div class="flex flex-col sm:flex-row gap-3">
    <a href="/"
       class="inline-flex items-center justify-center px-5 py-2.5 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg transition-colors space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span>返回首页</span>
    </a>
    <button onclick="window.location.reload()"
            class="inline-flex items-center justify-center px-5 py-2.5 bg-white border border-gray-200 hover:border-green-300 text-gray-600 hover:text-green-600 font-medium rounded-lg transition-colors space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <span>刷新页面</span>
    </button>
  </div>
</div>
{% endblock %}
