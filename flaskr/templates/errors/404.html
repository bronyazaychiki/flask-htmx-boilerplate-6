{% extends 'layouts/main.html' %}
{% block title %}页面未找到{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-16 sm:py-24 text-center">
  {# Visual icon #}
  <div class="w-24 h-24 rounded-full bg-yellow-100 flex items-center justify-center mb-8">
    <svg class="w-12 h-12 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </div>

  {# Big error code #}
  <div class="text-7xl sm:text-8xl font-extrabold text-gray-200 mb-3 select-none">404</div>

  {# Descriptive message #}
  <h2 class="text-xl sm:text-2xl font-semibold text-gray-700 mb-2">页面未找到</h2>
  <p class="text-gray-500 mb-8 max-w-sm px-4 text-sm sm:text-base">
    你访问的页面不存在或已被移除。请检查地址是否正确，或返回首页继续。
  </p>

  {# Action buttons #}
  <div class="flex flex-col sm:flex-row gap-3">
    <a href="/"
       class="inline-flex items-center justify-center px-5 py-2.5 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg transition-colors space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span>返回首页</span>
    </a>
    <a href="/todos"
       class="inline-flex items-center justify-center px-5 py-2.5 bg-white border border-gray-200 hover:border-green-300 text-gray-600 hover:text-green-600 font-medium rounded-lg transition-colors">
      <span>查看待办清单</span>
    </a>
  </div>
</div>
{% endblock %}
