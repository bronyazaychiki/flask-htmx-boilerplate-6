{% extends 'layouts/main.html' %}
{% block title %}Todos{% endblock %}
{% block content %}
<div class="w-2/3 mx-auto py-10 text-gray-600">
  <h1 class="text-3xl uppercase font-bold">Todos</h1>
</div>

<!-- Control bar: filter tabs + search -->
<div class="w-2/3 mx-auto mb-4">
  <form id="tab-filter-form" class="flex items-center justify-between flex-wrap gap-2">
    <input type="hidden" name="_status" value="all">
    <div class="flex items-center gap-1">
      <button type="submit" id="tab-all" name="status" value="all"
              data-tab="all"
              class="px-4 py-2 rounded text-sm font-medium border border-green-300 bg-green-200 text-green-800">
        All <span class="ml-1 text-xs tab-count">–</span>
      </button>
      <button type="submit" id="tab-pending" name="status" value="pending"
              data-tab="pending"
              class="px-4 py-2 rounded text-sm font-medium border border-green-300 bg-white text-gray-600 hover:bg-green-50">
        Pending <span class="ml-1 text-xs tab-count">–</span>
      </button>
      <button type="submit" id="tab-completed" name="status" value="completed"
              data-tab="completed"
              class="px-4 py-2 rounded text-sm font-medium border border-green-300 bg-white text-gray-600 hover:bg-green-50">
        Completed <span class="ml-1 text-xs tab-count">–</span>
      </button>
    </div>

    <input type="text"
           name="search"
           placeholder="Search todos…"
           autocomplete="off"
           class="bg-white h-9 px-4 pr-8 text-sm border border-green-300 rounded focus:outline-none focus:border-green-500"
           hx-get="/todos"
           hx-trigger="input changed delay:300ms"
           hx-target="#todo-list"
           hx-include="[name='_status']">
  </form>
</div>

<!-- Todo table -->
<div id="todo-list" class="w-2/3 mx-auto"
     hx-get="/todos" hx-trigger="load" hx-target="#todo-list" hx-swap="innerHTML">
  <table class="border-collapse w-full">
    <thead>
      <tr>
        <th class="p-3 bg-green-200 border border-green-400 w-12"></th>
        <th class="p-3 font-bold uppercase bg-green-200 text-gray-600 border border-green-400 text-left">Todo</th>
      </tr>
    </thead>
    <tbody id="todo-results">
    </tbody>
  </table>
</div>

<!-- Add todo form -->
<div class="w-2/3 mx-auto py-10 text-gray-600">
  <form id="add-todo-form">
    <input type="hidden" name="_status" value="all">
    <input
      type="text"
      name="todo"
      placeholder="e.g. Wash dishes"
      class="bg-white h-10 px-5 text-2xl focus:outline-none border border-green-300"
      hx-post="/todos/add"
      hx-target="#todo-list"
      hx-include="[name='todo'], [name='_status'], [name='search']"
    >
    <button type="button"
            class="bg-green-100 text-green-500 hover:bg-green-200 h-10 px-5 text-2xl"
            hx-post="/todos/add"
            hx-include="[name='todo'], [name='_status'], [name='search']"
            hx-target="#todo-list">Add</button>
  </form>
</div>
{% endblock %}
