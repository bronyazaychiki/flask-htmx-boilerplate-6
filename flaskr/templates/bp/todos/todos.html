{% for todo in todos %}
  <tr class="bg-white hover:bg-green-50 mb-0 {% if todo.completed %}opacity-50{% endif %}">
    <td class="p-3 text-center border border-green-400 w-12">
      <input type="checkbox" name="todo_ids" value="{{ todo.id }}"
        class="todo-checkbox h-4 w-4 text-green-600 border-green-400 rounded focus:ring-green-500">
    </td>
    <td class="p-3 text-gray-800 text-center border border-green-400 w-12">{{ todo.id }}</td>
    <td class="p-3 text-gray-800 border border-green-400
               {% if todo.completed %}line-through text-gray-400{% endif %}">
      {{ todo.name }}
    </td>
    <td class="p-3 text-center border border-green-400 w-24">
      <button hx-post="/todos/{{ todo.id }}/toggle" hx-swap="none"
        class="text-sm px-2 py-1 rounded
               {% if todo.completed %}
                 bg-yellow-100 text-yellow-700 hover:bg-yellow-200
               {% else %}
                 bg-green-100 text-green-700 hover:bg-green-200
               {% endif %}">
        {% if todo.completed %}Restore{% else %}Done{% endif %}
      </button>
    </td>
    <td class="p-3 text-center border border-green-400 w-16">
      <button hx-post="/todos/{{ todo.id }}/delete" hx-swap="none"
        hx-confirm="Delete this todo?"
        class="text-sm px-2 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200">
        Delete
      </button>
    </td>
  </tr>
{% endfor %}
{% if not todos %}
  <tr>
    <td colspan="5" class="p-8 text-center text-gray-400 border border-green-400 bg-white">
      No todos yet. Add one above!
    </td>
  </tr>
{% endif %}
