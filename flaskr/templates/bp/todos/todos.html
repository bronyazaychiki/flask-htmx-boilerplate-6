{% include 'bp/todos/_stats.html' %}

{% for todo in todos %}
<div class="group bg-white rounded-xl shadow-sm border border-gray-200 px-4 py-3 flex items-center gap-3 transition hover:shadow-md animate-fade-in
  {% if todo.done %}opacity-60{% endif %}">
  <!-- Toggle checkbox -->
  <label class="relative flex-shrink-0 w-5 h-5 cursor-pointer block">
    <input type="checkbox"
      class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
      hx-post="/todos/toggle/{{ todo.id }}"
      hx-target="#todo-list"
      {% if todo.done %}checked{% endif %}>
    <div class="w-5 h-5 rounded border-2 flex items-center justify-center transition
      {% if todo.done %}bg-green-500 border-green-500{% else %}border-gray-300 group-hover:border-green-400{% endif %}">
      {% if todo.done %}
      <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      {% endif %}
    </div>
  </label>

  <!-- Todo text -->
  <span class="flex-1 text-gray-700 {% if todo.done %}line-through text-gray-400{% endif %}">
    {{ todo.name }}
  </span>

  <!-- Delete button -->
  <button
    class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition flex-shrink-0 p-1 rounded hover:bg-red-50"
    hx-post="/todos/delete/{{ todo.id }}"
    hx-target="#todo-list"
    onclick="return confirm('Delete this todo?')"
    title="Delete">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
    </svg>
  </button>
</div>
{% else %}
<!-- Empty state -->
<div class="py-20 text-center">
  <svg class="w-14 h-14 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
  </svg>
  <p class="text-gray-500 font-medium">No todos yet</p>
  <p class="text-sm text-gray-400 mt-1">Add your first task above to get started</p>
</div>
{% endfor %}
