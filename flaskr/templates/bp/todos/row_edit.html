<tr id="todo-{{ todo.id }}" class="editing bg-yellow-50">
  <td class="p-3 text-gray-800 text-center border border-yellow-400 w-16">
    {{ todo.id }}
  </td>
  <td class="p-3 border border-yellow-400">
    <input type="text"
           name="name"
           value="{{ todo.name }}"
           class="w-full px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
           autofocus>
    {% if error %}
      <p class="text-red-500 text-xs mt-1">{{ error }}</p>
    {% endif %}
  </td>
  <td class="p-3 border border-yellow-400 text-center whitespace-nowrap w-56">
    <button class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700 mr-1"
            hx-post="/todos/{{ todo.id }}/save"
            hx-target="#todo-{{ todo.id }}"
            hx-swap="outerHTML"
            hx-include="closest tr">
      Save
    </button>
    <button class="px-2 py-1 text-xs bg-gray-500 text-white rounded hover:bg-gray-600"
            hx-get="/todos/{{ todo.id }}/display"
            hx-target="#todo-{{ todo.id }}"
            hx-swap="outerHTML">
      Cancel
    </button>
  </td>
</tr>
