<div id="stats-grid" hx-swap-oob="outerHTML:#stats-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
  <!-- Total -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex items-center gap-4 transition hover:shadow-md">
    <div class="w-11 h-11 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
    </div>
    <div>
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Total</p>
      <p class="text-2xl font-bold text-gray-800">{{ stats.total }}</p>
    </div>
  </div>
  <!-- Pending -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex items-center gap-4 transition hover:shadow-md">
    <div class="w-11 h-11 rounded-lg bg-amber-100 flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <div>
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Pending</p>
      <p class="text-2xl font-bold text-amber-600">{{ stats.pending }}</p>
    </div>
  </div>
  <!-- Completed -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex items-center gap-4 transition hover:shadow-md">
    <div class="w-11 h-11 rounded-lg bg-green-100 flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <div>
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Completed</p>
      <p class="text-2xl font-bold text-green-600">{{ stats.completed }}</p>
    </div>
  </div>
</div>
