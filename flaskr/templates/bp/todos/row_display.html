<tr id="todo-{{ todo.id }}"
    class="{% if todo.completed %}opacity-50{% else %}bg-white hover:bg-green-50{% endif %} transition-opacity">
  <td class="p-3 text-gray-800 text-center border border-green-400 w-16">
    {% if todo.completed %}
      <span class="text-green-500">&#10003;</span>
    {% else %}
      {{ todo.id }}
    {% endif %}
  </td>
  <td class="p-3 border border-green-400">
    <span class="{% if todo.completed %}line-through text-gray-400{% else %}text-gray-800{% endif %}">
      {{ todo.name }}
    </span>
  </td>
  <td class="p-3 border border-green-400 text-center whitespace-nowrap w-56">
    {% if todo.completed %}
      <button class="px-2 py-1 text-xs bg-yellow-500 text-white rounded hover:bg-yellow-600 mr-1"
              hx-post="/todos/{{ todo.id }}/toggle"
              hx-target="#todo-{{ todo.id }}"
              hx-swap="outerHTML">
        Restore
      </button>
    {% else %}
      <button class="px-2 py-1 text-xs bg-green-500 text-white rounded hover:bg-green-600 mr-1"
              hx-post="/todos/{{ todo.id }}/toggle"
              hx-target="#todo-{{ todo.id }}"
              hx-swap="outerHTML">
        Complete
      </button>
    {% endif %}

    <button class="px-2 py-1 text-xs bg-blue-500 text-white rounded hover:bg-blue-600 mr-1"
            hx-get="/todos/{{ todo.id }}/edit"
            hx-target="#todo-{{ todo.id }}"
            hx-swap="outerHTML">
      Edit
    </button>

    <button class="px-2 py-1 text-xs bg-red-500 text-white rounded hover:bg-red-600"
            hx-post="/todos/{{ todo.id }}/delete"
            hx-target="#todo-{{ todo.id }}"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to delete this todo?">
      Delete
    </button>
  </td>
</tr>
